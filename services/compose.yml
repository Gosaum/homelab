services:
  caddy:
    build: ./caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - /var/run/tailscale:/var/run/tailscale
    depends_on:
      webserver:
        condition: service_healthy
    restart: unless-stopped
  webserver:
    build: ./webserver
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/api/ping" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
